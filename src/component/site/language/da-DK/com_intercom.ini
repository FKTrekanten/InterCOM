COM_INTERCOM_ALL_AUDIENCE_HELP="Markeret: denne Joomla-gruppe kan skrive til hele CleverReach-listen valgt i Indstillinger eller til enhver aktiveret holdgruppe. De tilladte holdtags i denne række begrænser ikke den adgang. Ikke markeret: brugerne skal vælge blandt de holdtags, de har fået adgang til. Valgte medlemskabs-, alders- og kønsfiltre samt medlemmernes fravalg gælder stadig; holdnyt kræver stadig valg af et hold."
COM_INTERCOM_AUDIENCE_GRANTS_HELP="Adgang fra alle brugerens Joomla-grupper, inklusive nedarvede grupper, lægges sammen. Adgang til alle medlemmer fra én gruppe tilsidesætter holdbegrænsninger. Komponentadministratorer har altid fuld modtageradgang. Denne indstilling giver ikke i sig selv ret til at skrive eller sende en kommunikationstype."
