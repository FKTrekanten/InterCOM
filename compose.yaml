name: intercom
services:
  db:
    image: mariadb:10.6@sha256:daacc2f260f8ec999daa5e03a017a23a7e6fa3fb982aaf26e8b72f24daf03bc9
    environment:
      MARIADB_ROOT_PASSWORD: intercom-local-only
      MARIADB_DATABASE: intercom
      MARIADB_USER: intercom
      MARIADB_PASSWORD: intercom-local-only
    volumes: ["db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
  joomla:
    image: joomla:6.1.3-php8.3-apache@sha256:374819d283e64de54b49e23031c8d9c71b7b88f014da705c3d3af48ca9951a1c
    healthcheck:
      test: ["CMD", "php", "-r", "exit(is_file('/var/www/html/libraries/vendor/autoload.php') && @fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 3s
      timeout: 5s
      retries: 40
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:${INTERCOM_PORT:-8088}:80"]
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_USER: intercom
      JOOMLA_DB_PASSWORD: intercom-local-only
      JOOMLA_DB_NAME: intercom
    volumes:
      - joomla:/var/www/html
      - .:/workspace:ro
volumes:
  db:
  joomla:
